<!doctype html><html lang="vi"><meta charset="utf-8"><title>VietK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091227;color:white;font:20px 'Segoe UI',sans-serif;overflow:hidden}#panel{width:1280px;height:768px;transform-origin:top left;background:linear-gradient(125deg,#123a66,#111d3d)}iframe{border:0;width:1280px;display:block}#top{height:73px}#bottom{height:70px;position:absolute;bottom:0}main{padding:14px 28px;height:625px}nav{display:flex;gap:8px;margin-bottom:14px}button{font:inherit;color:white;border:1px solid #6992b7;border-radius:6px;padding:10px 16px;background:#244a70;cursor:pointer}button:hover{background:#38678f}input{font:inherit;padding:12px;border-radius:6px;border:1px solid #709dc5;flex:1;min-width:0}#toolbar{display:flex;gap:10px}#songs,#queue{height:430px;overflow:auto;margin-top:12px}article{display:flex;align-items:center;gap:15px;padding:10px 12px;border-bottom:1px solid #375678}article:nth-child(even){background:#193355}article .info{flex:1}small{display:block;color:#a8bed7;font-size:15px}.number{color:#9dbbd9;width:80px}.available{color:#74dfb0}#status{font-size:16px;padding:10px 0;color:#d6e4f2}#current{font-size:18px;color:#94d8fa}#count{margin-left:auto;font-size:16px;align-self:center}#queue{display:none}.active{background:#376e9e}#note{font-size:14px;color:#b1c3dc;margin-top:5px}
</style>
<div id="panel"><iframe id="top" src="../assets/template/module_top/index.html" title="Thanh trên gốc"></iframe><main>
<nav><button id="songtab" class="active">Bài hát</button><button id="queuetab">Đã chọn <span id="qcount">0</span></button><button onclick="send('folder')">Thư mục nhạc</button><button onclick="send('open')">Mở video</button><button onclick="send('tv')">Màn hình TV</button><button onclick="send('full')">TV toàn màn hình</button><span id="count"></span></nav>
<div id="toolbar"><input id="search" placeholder="Tên bài hát, ca sĩ hoặc mã số…" aria-label="Tìm bài hát"><button onclick="search()">Tìm</button><button onclick="send('play')">Phát / Dừng</button><button onclick="send('next')">Chuyển bài</button></div>
<div id="songs"></div><div id="queue"></div><div id="current"></div><div id="status" role="status"></div><div id="note">Windows port preview · Tệp nhạc cần có trên PC · <a href="#" onclick="send('download');return false" style="color:#9dcaee">Tải bài</a></div>
</main><iframe id="bottom" src="../assets/template/module_bottom/index.html" title="Điều khiển gốc"></iframe></div>
<script>
const $=id=>document.getElementById(id);const send=(action,rest={})=>chrome.webview.postMessage({action,...rest});
function scale(){const n=Math.min(innerWidth/1280,innerHeight/768);$('panel').style.transform=`scale(${n})`;$('panel').style.marginLeft=`${(innerWidth-1280*n)/2}px`;}addEventListener('resize',scale);scale();
function row(title,singer,number,label,click,available){let a=document.createElement('article');let n=document.createElement('span');n.className='number';n.textContent=number;a.append(n);let d=document.createElement('div');d.className='info';d.textContent=title;let s=document.createElement('small');s.textContent=singer;d.append(s);a.append(d);let b=document.createElement('button');b.textContent=label;b.onclick=click;a.append(b);if(available){let p=document.createElement('small');p.textContent='Có tệp';p.className='available';a.append(p);}return a;}
function show(view){$('songs').style.display=view==='songs'?'block':'none';$('queue').style.display=view==='queue'?'block':'none';$('songtab').classList.toggle('active',view==='songs');$('queuetab').classList.toggle('active',view==='queue');} $('songtab').onclick=()=>show('songs');$('queuetab').onclick=()=>show('queue');
let timer;function search(){send('search',{text:$('search').value});}$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(search,180)};
chrome.webview.addEventListener('message',event=>{const d=event.data;if(d.type==='songs'){$('songs').replaceChildren(...d.songs.map(s=>row(s.title,s.singer,s.id,'Chọn',()=>send('add',{id:s.id}),s.available)));$('count').textContent=d.total.toLocaleString('vi-VN')+' bài';}if(d.type==='state'){$('status').textContent=d.status;$('current').textContent=d.current?`Đang phát: ${d.current} · Âm lượng ${d.volume}%`:'';$('qcount').textContent=d.queue.length;$('queue').replaceChildren(...d.queue.map(s=>row(s.title,s.singer,s.index+1,'Bỏ chọn',()=>send('remove',{index:s.index}),false)));$('bottom').contentWindow.postMessage({type:'state',playing:d.playing,vocal:d.vocal},location.origin);}if(d.type==='navigate')show(d.view);if(d.type==='refresh')search();});
addEventListener('message',event=>{if(event.origin===location.origin&&[ $('top').contentWindow,$('bottom').contentWindow].includes(event.source)&&event.data?.action)send(event.data.action)});send('ready');
</script></html>

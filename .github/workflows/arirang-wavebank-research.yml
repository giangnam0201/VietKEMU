name: Check Arirang instrument-bank research
on:
  push:
    branches: [codex/arirang-midi]
    paths:
      - 'tools/arirang_wavebank_research.py'
      - 'tools/test_arirang_wavebank_research.py'
      - '.github/workflows/arirang-wavebank-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check synthetic bank pointers, ranges and block transformation
        run: python tools/test_arirang_wavebank_research.py

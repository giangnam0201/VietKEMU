name: Build original native Windows components
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify original song search rules
        run: dotnet run --project windows/VietK.CoreChecks -c Release
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install original image format converter
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Retrieve full original decode
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37386126110 -n original-apk-full-decode -D decoded
      - name: Retrieve original firmware fonts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37417309368 -n original-firmware-ui-assets -D firmware-ui-fonts
      - name: Package the original home and bottom bar resources
        run: python tools/package_native_home.py decoded original --firmware-ui firmware-ui-fonts
      - name: Create decoder verification signals
        run: python tools/create_playback_fixtures.py playback-fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: playback-decoder-fixtures
          path: playback-fixtures/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: original-native-home-resources
          path: original/
          retention-days: 7
  windows:
    needs: [resources, core]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: original-native-home-resources
          path: windows/VietK.NativePort/Original/
      - name: Compile native Windows executable
        run: dotnet publish windows/VietK.NativePort -c Release -r win-x64 --self-contained true -o artifacts/native-windows
      - uses: actions/download-artifact@v4
        with:
          name: playback-decoder-fixtures
          path: artifacts/playback-fixtures/
      - name: Render original home component on Windows
        run: |
          $process = Start-Process -FilePath artifacts/native-windows/VietK.NativePort.exe -ArgumentList '--capture', 'artifacts/native-verification' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native rendering failed: $($process.ExitCode)" }
      - name: Verify real Windows video and karaoke audio controls
        run: |
          $process = Start-Process -FilePath artifacts/native-windows/VietK.NativePort.exe -ArgumentList '--verify-playback', 'artifacts/playback-fixtures', 'artifacts/native-verification/playback' -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(180000)) { $process.Kill(); throw 'Native playback verification timed out' }
          if ($process.ExitCode -ne 0) { throw "Native playback verification failed: $($process.ExitCode)" }
      - name: Retain native failure diagnostics
        if: failure()
        run: |
          New-Item -ItemType Directory -Force artifacts/native-verification | Out-Null
          if (Test-Path "$env:TEMP/vietk-native-startup-error.txt") {
            Copy-Item "$env:TEMP/vietk-native-startup-error.txt" artifacts/native-verification/
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-verification
          path: artifacts/native-verification/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-component
          path: artifacts/native-windows/
          retention-days: 7
      - name: Package Windows test download
        shell: pwsh
        run: |
          ./tools/package_windows_test.ps1 -PublishDirectory artifacts/native-windows -OutputDirectory artifacts/windows-test -BuildId "${{ github.run_number }}-${{ github.sha }}"
          @'
          ### Windows test build
          Download **VietK-Windows-test-build** from this run's Artifacts section.
          Extract the artifact, then extract the contained VietK-Windows ZIP completely and open **VietK.NativePort.exe**.
          Windows x64; .NET and the native decoder are included. This is a partial native port: a video player and TV window are implemented; song storage/download integration and full original OSD are still incomplete.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: VietK-Windows-test-build
          path: artifacts/windows-test/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

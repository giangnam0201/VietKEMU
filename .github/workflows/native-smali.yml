name: Collect authoritative original port bytecode
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve completed original decode
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37386126110 -n original-apk-full-decode -D decoded
      - name: Retain song and playlist bytecode with DEX provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          app = Path('decoded/dualkmbox')
          apktool = app / 'apktool'
          output = Path('bytecode-review')
          classes = {'SongDAO', 'SongIdDAO', 'MediaDAO', 'WholeSongDAO', 'SelectedListDAO', 'Song', 'Media',
                     'PlayListDAOManager',
                     'PlayListManager', 'KmPlayListItem', 'SelectedLocalListManager',
                     'SongDownListManager', 'SongDownListDAO', 'DownListDAOManager', 'OrderSongManger', 'ReportTableManager',
                     'SongDownloadManager', 'LocalOnlineSongManager', 'BaseOnlineSongManager', 'MsOnlineSongManager', 'NoEvideoOnlineManager',
                     'DCDomain', 'DataCenterMessage', 'DataCenterCommuProxy', 'HttpFile', 'SongManager',
                     'AppDownloadManager', 'DownLoadTaskItem',
                     'MuiltCollectListManager', 'SongRecyclerGridViewAdapter', 'UpdateDbManager'}
          entries = {entry['path']: entry for entry in json.loads((app/'original-entries.json').read_text())}
          files = []
          found = set()
          for root in apktool.glob('smali*'):
              if not root.is_dir(): continue
              dex = 'classes.dex' if root.name == 'smali' else root.name.removeprefix('smali_') + '.dex'
              for source in (root/'com/evideo/kmbox').rglob('*.smali'):
                  name = source.stem.split('$')[0]
                  if name not in classes: continue
                  relative = source.relative_to(apktool)
                  destination = output / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)
                  files.append({'path': relative.as_posix(), 'decodedSha256': hashlib.sha256(source.read_bytes()).hexdigest(),
                                'originalDex': dex, 'originalDexSha256': entries[dex]['sha256']})
                  found.add(name)
          missing = {'SongDAO','SongIdDAO','MediaDAO','PlayListManager','KmPlayListItem','Song'} - found
          if missing: raise RuntimeError('Missing original bytecode: ' + ','.join(sorted(missing)))
          (output/'provenance.json').write_text(json.dumps(files, indent=2))
          PY
      - name: Retain original data-center service transport and login bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          app = Path('decoded/KmDataCenterService')
          output = Path('bytecode-review/KmDataCenterService')
          classes = {'DataCenterService', 'BaseDataCenterCommu', 'DataCenterCommu', 'CommonDataCenterCommu',
                     'KtvDataCenterCommu', 'DataCenterConfigure', 'DataCenterMessage', 'DataCenterToken',
                     'DataCenterSign', 'UriManager', 'DataCenterHttp', 'DataCenterHttps', 'DataCenterHttpFactory',
                     'OkHttpClientFactory', 'SignHeaderAttach', 'BaseSignHeaderAttach', 'SignHeaderAttachFactory'}
          entries = {entry['path']: entry for entry in json.loads((app/'original-entries.json').read_text())}
          files = []
          found = set()
          for root in (app/'apktool').glob('smali*'):
              if not root.is_dir(): continue
              dex = 'classes.dex' if root.name == 'smali' else root.name.removeprefix('smali_') + '.dex'
              for source in (root/'com/evideo').rglob('*.smali'):
                  name = source.stem.split('$')[0]
                  if name not in classes: continue
                  relative = source.relative_to(app/'apktool')
                  destination = output / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, destination)
                  files.append({'path': relative.as_posix(), 'decodedSha256': hashlib.sha256(source.read_bytes()).hexdigest(),
                                'originalDex': dex, 'originalDexSha256': entries[dex]['sha256']})
                  found.add(name)
          missing = {'DataCenterService', 'BaseDataCenterCommu', 'DataCenterCommu', 'DataCenterHttp'} - found
          if missing: raise RuntimeError('Missing original server transport bytecode: ' + ','.join(sorted(missing)))
          (output/'provenance.json').write_text(json.dumps(files, indent=2))
          PY
      - name: Retain original main-screen UI reference
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          app=Path('decoded/dualkmbox')
          out=Path('bytecode-review/ui-reference')
          records=[]
          paths=list((app/'apktool/res/layout').glob('*.xml'))
          paths+=list((app/'apktool/res/values').glob('*.xml'))
          paths+=list((app/'apktool/res/values-vi').glob('*.xml'))
          paths+=[app/'apktool/assets/default_template.zip']
          for path in paths:
              relative=path.relative_to(app/'apktool')
              target=out/relative;target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(path,target)
              records.append({'path':relative.as_posix(),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          (out/'provenance.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-song-playlist-bytecode
          path: bytecode-review/
          retention-days: 7

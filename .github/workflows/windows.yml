name: Windows port build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Retrieve original firmware applications privately
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37324921816 -n firmware-applications -D firmware
      - name: Preserve original catalogue and interface template
        run: python tools/prepare_windows_assets.py --apk firmware/vendor/app/dualkmbox/dualkmbox.apk --output desktop/VietK.Windows/assets
      - name: Compile portable Windows application on GitHub
        run: dotnet publish desktop/VietK.Windows -c Release -r win-x64 --self-contained true -o dist/VietKEMU
      - name: Verify native playback runtime and original song catalogue
        working-directory: dist/VietKEMU
        run: |
          $process = Start-Process -FilePath .\VietKEMU.exe -ArgumentList '--self-test' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Native Windows self-test failed' }
          Get-Content self-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: VietKEMU-Windows-preview
          path: dist/VietKEMU/
          retention-days: 7

name: Original application compatibility
on:
  workflow_dispatch:
    inputs:
      analysis_run:
        description: Successful firmware analysis run ID
        required: true
        type: string
      vendor_run:
        description: Optional vendor research run for original VDK provisioning
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download private extracted applications
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_RUN: ${{ inputs.analysis_run }}
          VENDOR_RUN: ${{ inputs.vendor_run }}
        run: |
          gh run download "$ANALYSIS_RUN" -n firmware-applications -D firmware
          gh run download "$ANALYSIS_RUN" -n firmware-report -D firmware
          if [ -n "$VENDOR_RUN" ]; then
            gh run download "$VENDOR_RUN" -n vendor-runtime-original -D original-vdk
          fi
      - name: Enable runner virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test original app installation and launch
        env:
          VENDOR_RUN: ${{ inputs.vendor_run }}
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system
          script: |
            if [ -n "$VENDOR_RUN" ]; then python tools/provision_vdk.py original-vdk; fi
            python tools/probe_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-app-compatibility
          path: artifacts/android-probe/
          retention-days: 7

name: Original APK port
on:
  workflow_dispatch:
    inputs:
      emulator-build:
        description: 'Optional official emulator build ID for controlled runtime regression testing'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download original applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37324921816 -n firmware-applications -D firmware
          gh run download 37324921816 -n firmware-report -D firmware
          mkdir -p keys
          python - <<'PY'
          import subprocess, json, base64, pathlib
          for kind in ('platform', 'testkey', 'shared', 'media'):
              for extension in ('pk8', 'x509.pem'):
                  name = f'{kind}.{extension}'
                  result = subprocess.run(['gh','api',f'repos/aosp-mirror/platform_build/contents/target/product/security/{name}?ref=android-11.0.0_r48'],check=True,capture_output=True,text=True)
                  pathlib.Path('keys',name).write_bytes(base64.b64decode(json.loads(result.stdout)['content']))
          PY
      - name: Install build tools on GitHub
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Prepare Android development runtime with ARM translation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p artifacts/runtime
          gh api repos/unix3dgforce/lpunpack/contents/lpunpack.py?ref=c59b8f3b069c5a8aa438a049fa4a091177172434 --jq .content | base64 -d > artifacts/runtime/lpunpack.py
          "$SDKMANAGER" 'system-images;android-30;google_apis;x86_64'
          sudo python tools/prepare_runtime_image.py extract --image "$ANDROID_HOME/system-images/android-30/google_apis/x86_64/system.img" --work artifacts/runtime
          "$SDKMANAGER" --uninstall 'system-images;android-30;google_apis;x86_64'
          "$SDKMANAGER" 'system-images;android-30;default;x86_64'
      - name: Compile portable vendor JNI adapter
        run: |
          mkdir -p artifacts/port
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi23-clang" -shared -fPIC -Wall -Wextra -Werror -Wno-unused-parameter runtime/native/vdk_adapter.c runtime/native/audio_record.c -llog -o artifacts/port/libvdk.so
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi23-clang" -shared -fPIC -Wall -Wextra -Werror -Wno-unused-parameter runtime/native/factory_uart.c -o artifacts/port/libfactoryuart.so
      - name: Port copies with original UI and application DEX preserved
        run: |
          python tools/port_apks.py --root firmware --vdk firmware/system/framework/vdk.jar --native artifacts/port/libvdk.so --serial artifacts/port/libfactoryuart.so --output artifacts/port/apks --key keys/platform.pk8 --certificate keys/platform.x509.pem --signer "$ANDROID_HOME/build-tools/35.0.0/apksigner" --aligner "$ANDROID_HOME/build-tools/35.0.0/zipalign"
      - uses: actions/upload-artifact@v4
        with:
          name: ported-apk-prototype
          path: artifacts/port/
          retention-days: 7
      - name: Release temporary compiler space before Android boot
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --uninstall 'ndk;27.2.12479018'
          df -h "$HOME"
      - name: Enable runner virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the actual ported karaoke stack
        timeout-minutes: 12
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-build: ${{ inputs.emulator-build }}
          ram-size: 2048M
          disk-size: 4G
          emulator-boot-timeout: 300
          pre-emulator-launch-script: python tools/configure_displays.py
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -writable-system -show-kernel -logcat '*:W'
          script: |
            python tools/run_port_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-port-runtime-evidence
          path: artifacts/port-runtime/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: runtime-adapted-original-apps
          path: artifacts/port/apks/
          retention-days: 7

name: Inspect current official music firmware
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only firmware inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y e2fsprogs android-sdk-libsparse-utils aapt apktool binutils
          python -m pip install gdown==5.2.0
      - name: Download publicly distributed KTV-Plus firmware and JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gdown 1-l9rE_5GLyvkgYMGya14mucQGPaLaE2A -O incoming/KTV-Plus_ota_package.zip
          gh release download v1.5.6 --repo skylot/jadx --pattern 'jadx-1.5.6.zip' --dir incoming
          unzip -q incoming/jadx-1.5.6.zip -d jadx
          chmod +x jadx/bin/jadx
      - name: Inventory and decode original music applications
        env:
          JAVA_OPTS: -Xmx5g
        run: python tools/inspect_current_firmware.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-official-music-firmware
          path: artifacts/current-firmware/
          retention-days: 7
          compression-level: 6

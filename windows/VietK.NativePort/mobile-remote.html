<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VietK — Điều khiển</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#180936;color:white}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#170d48,#481740);min-height:100vh}header{padding:18px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#210c3ceF;z-index:3}.logo{font-size:32px;font-weight:800}.logo b{color:#7ccb25}small{color:#dbcaef}main{max-width:800px;margin:auto;padding:12px 12px 170px}button,input{font:inherit;border:0;border-radius:12px;padding:12px;color:white}button{background:linear-gradient(120deg,#aa36d0,#7437e9);cursor:pointer;min-height:44px}button:active{transform:scale(.95)}button:disabled{opacity:.45}input{background:#180c31;width:100%;outline:2px solid #5c3589}form{display:flex;gap:8px}form input{min-width:0}nav{display:flex;gap:8px;margin:16px 0}.tab{flex:1;background:#392153}.tab.active{background:#7540b9;color:#ffe761}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#251240;border-radius:14px;overflow:hidden}.card img{width:100%;aspect-ratio:16/9;object-fit:cover}.card h3{font-size:15px;line-height:1.4;padding:0 10px;min-height:42px}.actions{display:flex;gap:6px;padding:8px}.actions button{flex:1;font-size:13px;padding:9px}.row{background:#2a143f;border-radius:12px;padding:12px;margin:8px 0}.row.playing{border:1px solid #ffe761}.row h3{font-size:16px;margin:0 0 8px}.row small{display:block}.row button{padding:8px;font-size:14px}footer{position:fixed;bottom:0;width:100%;background:#210c3cf5;border-top:1px solid #754b9b;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:4}.controls{max-width:800px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status{font-size:13px;line-height:1.4;margin:10px 0;color:#e0cafa}#notice{position:fixed;top:76px;left:12px;right:12px;z-index:5;background:#533279;padding:12px;border-radius:12px;display:none}#offline{color:#ffc077}h2{font-size:20px}.hidden{display:none}
</style>
<header><span class="logo">Viet<b>K</b></span><small id="connection">Đang kết nối…</small></header>
<div id="notice" role="alert"></div>
<main>
<form id="search"><input id="query" maxlength="200" placeholder="Tìm bài hát hoặc dán link YouTube" aria-label="Tìm bài hát"><button id="searchButton">Tìm</button></form>
<nav><button class="tab active" id="songsTab">Bài hát</button><button class="tab" id="queueTab">Đã chọn <span id="count">0</span></button></nav>
<section id="songs"><p class="status">Tìm bài hát, rồi chọn “Thêm bài” hoặc “Hát ngay”. Video phát trên TV của PC.</p><div id="results" class="cards"></div></section>
<section id="queue" class="hidden"><div class="actions"><button id="shuffle">Xáo trộn</button><button id="clear">Xóa bài chờ</button><button id="retry">Thử tải lại</button></div><div id="rows"></div></section>
<details><summary>Vui nhộn / TV</summary><div class="actions" id="effects"></div><form id="wish"><input id="wishText" maxlength="30" placeholder="Lời chúc (30 ký tự)"><button>Gửi</button></form><div class="actions"><button id="screen">Bật / Tắt hình TV</button></div></details>
<p class="status" id="state"></p><p class="status" id="offline"></p>
</main>
<footer><div class="controls"><button data-command="voldec">− Giảm âm</button><button data-command="play_imv" id="pause">Dừng / Tiếp tục</button><button data-command="volinc">+ Tăng âm</button><button data-command="replay_imv">Phát lại</button><button data-command="cut_song_imv">Qua bài</button><span class="status" id="volume"></span></div></footer>
<script>
'use strict';
const $=id=>document.getElementById(id);
const fromQr=new URLSearchParams(location.hash.slice(1)).get('token');
if(fromQr){sessionStorage.setItem('vietk-token',fromQr);history.replaceState(null,'',location.pathname);}
const token=sessionStorage.getItem('vietk-token')||'';let stateBusy=false,lastQueue='',noticeTimer;
function notice(message){$('notice').textContent=message;$('notice').style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').style.display='none',5000);}
async function api(path,body,signal){const response=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store',signal});if(!response.ok){if(response.status===401)throw Error('Kết nối hết hạn. Quét lại QR trên TV.');if(response.status===429)throw Error('Đang tìm bài khác. Thử lại sau.');let error;try{error=(await response.json()).error;}catch{}throw Error(error||'Không kết nối được VietK.');}return response.json();}
async function action(value){try{await api('action',value);await refresh();}catch(error){notice(error.message);}}
function button(text,callback){const result=document.createElement('button');result.textContent=text;result.onclick=callback;return result;}
function showTab(queue){$('songs').classList.toggle('hidden',queue);$('queue').classList.toggle('hidden',!queue);$('songsTab').classList.toggle('active',!queue);$('queueTab').classList.toggle('active',queue);}
$('songsTab').onclick=()=>showTab(false);$('queueTab').onclick=()=>showTab(true);
let searching;
$('search').onsubmit=async event=>{event.preventDefault();const query=$('query').value.trim();if(!query)return;searching?.abort();searching=new AbortController();$('searchButton').disabled=true;$('searchButton').textContent='Đang tìm…';showTab(false);try{const items=await api('search?q='+encodeURIComponent(query),null,searching.signal);$('results').replaceChildren();if(!items.length)notice('Không tìm thấy bài hát.');for(const item of items){const card=document.createElement('article');card.className='card';if(item.thumbnail){const image=document.createElement('img');try{const u=new URL(item.thumbnail);if(u.protocol==='https:'&&['i.ytimg.com','img.youtube.com'].includes(u.hostname)){image.src=u.href;image.loading='lazy';image.alt='';card.append(image);}}catch{}}const title=document.createElement('h3');title.textContent=item.title;card.append(title);const controls=document.createElement('div');controls.className='actions';controls.append(button('Thêm bài',()=>action({action:'add',id:item.id})),button('Hát ngay',()=>{if(confirm('Hát ngay và thay bài đang phát?'))action({action:'add',id:item.id,first:true});}));card.append(controls);$('results').append(card);}}catch(error){if(error.name!=='AbortError')notice(error.message);}finally{$('searchButton').disabled=false;$('searchButton').textContent='Tìm';}};
async function refresh(){if(stateBusy||document.hidden)return;stateBusy=true;try{const state=await api('state');$('connection').textContent='Đã kết nối';$('offline').textContent='';$('state').textContent=state.status;$('volume').textContent='Âm lượng '+state.volume+'/20';$('pause').textContent=state.paused?'Tiếp tục':'Dừng';$('count').textContent=state.queue.length;const stamp=JSON.stringify([state.queue,state.active,state.transfers]);if(stamp!==lastQueue){lastQueue=stamp;$('rows').replaceChildren();state.queue.forEach((item,index)=>{const row=document.createElement('article');row.className='row'+(index===0&&state.active?' playing':'');const title=document.createElement('h3');title.textContent=(index===0&&state.active?'▶ ':String(index+1)+'. ')+item.title;row.append(title);const transfer=state.transfers[item.id];if(transfer){const progress=document.createElement('small');progress.textContent=transfer.error?'Lỗi tải':transfer.waiting?'Chờ đợi':transfer.total>0?Math.floor(100*transfer.received/transfer.total)+'%':(transfer.received/1048576).toFixed(1)+' MiB';row.append(progress);}const controls=document.createElement('div');controls.className='actions';if(index>0){controls.append(button('Ưu tiên',()=>action({action:'top',id:item.id})));if(index>1)controls.append(button('↑',()=>action({action:'move',id:item.id,target:index-1})));if(index<state.queue.length-1)controls.append(button('↓',()=>action({action:'move',id:item.id,target:index+1})));}controls.append(button(index===0?'Qua bài':'Xóa',()=>{if(index>0||confirm('Qua bài đang phát?'))action({action:'remove',id:item.id});}));row.append(controls);$('rows').append(row);});}}catch(error){$('connection').textContent='Mất kết nối';$('offline').textContent=error.message;}finally{stateBusy=false;}}
document.querySelectorAll('[data-command]').forEach(control=>control.onclick=()=>{const id=control.dataset.command;if(id!=='cut_song_imv'||confirm('Qua bài đang phát?'))action({action:'command',id});});
$('shuffle').onclick=()=>action({action:'shuffle'});$('clear').onclick=()=>{if(confirm('Xóa các bài đang chờ?'))action({action:'clear'});};$('retry').onclick=()=>action({action:'retry'});
for(const [id,label] of [['memeda','Hôn'],['xianhua','Hoa'],['zan','Thích'],['baodeng','Yêu'],['wuyafeiguo','Vỗ tay'],['zajidan','Chê'],['birthday','Sinh nhật'],['zaiyiqi','Bên nhau']])$('effects').append(button(label,()=>action({action:'expression',id})));
$('effects').style.flexWrap='wrap';$('wish').onsubmit=event=>{event.preventDefault();const id=$('wishText').value.trim();if(id)action({action:'wish',id});};$('screen').onclick=()=>action({action:'screen'});
setInterval(refresh,1000);document.addEventListener('visibilitychange',refresh);refresh();
</script></html>
